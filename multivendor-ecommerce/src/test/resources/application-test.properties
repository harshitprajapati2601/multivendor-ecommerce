# ===== Phase 8 test profile =====
# Overrides src/main/resources/application.properties, which Spring always
# loads first. Anything not overridden here is inherited from that file.
#
# !!! WARNING !!!
# ddl-auto=create-drop DROPS EVERY TABLE in the schema below at the end of
# each test run. The database name MUST stay multivendor_test_db. Never point
# this at multivendor_db or you will lose your Postman test data.

# ===== Dedicated MySQL test schema =====
spring.datasource.url=jdbc:mysql://localhost:3306/multivendor_test_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== Schema is built fresh, then dropped when the test JVM exits =====
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Batch the DDL so building ~14 tables at startup is not painfully slow
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===== Connection pool: small, and fail fast instead of hanging 30s =====
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000

# ===== JWT: fixed dev-only secret so tests are deterministic =====
app.jwt.secret=dGVzdC1vbmx5LXNlY3JldC1rZXktbXVzdC1iZS0zMi1ieXRlcy1sb25nLTEyMzQ1Ng==
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# ===== OTP =====
app.otp.length=6
app.otp.expiration-minutes=10

# ===== OAuth2: dummy values. These beans MUST exist or the whole Spring =====
# ===== context fails to start, because SecurityConfig calls oauth2Login() =====
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ===== Keep Day 25 behaviour so 404 still routes to GlobalExceptionHandler =====
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ===== Quiet logs =====
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
logging.level.com.ecommerce.platform=WARN